# Deploy to Vercel production on every push to main.
#
# Vercel's own git integration does not work for us: these repositories are
# private and owned by a GitHub organisation, which the Hobby plan does not
# support. That left production 23 days stale on insurance before anyone
# noticed. This does the same job through Actions, which has no restriction.
#
# IMPORTANT — the build happens ON VERCEL, not here.
#
# The first version of this workflow ran `vercel build` in the runner and
# deployed with --prebuilt. It went green and took production down with
# MIDDLEWARE_INVOCATION_FAILED: a prebuilt upload does not carry the
# project's runtime environment, so middleware booted with no Supabase URL
# and threw on every request. The log said so plainly —
#   "WARNING! Build not running on Vercel. System environment variables
#    will not be available."
# Do not reintroduce `vercel build` or `--prebuilt` here.
#
# Requires one repository secret beyond the two IDs:
#   VERCEL_TOKEN  from vercel.com/account/tokens
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push supersedes one still deploying — never race two deploys.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy (Vercel builds remotely, with the project's env)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify the running commit matches this one
        if: ${{ hashFiles('**/app/api/health/route.ts', '**/src/app/api/health/route.ts') != '' }}
        run: |
          sleep 15
          for url in https://admin.creditspeed.in https://team.creditspeed.in; do
            live=$(curl -s --max-time 20 "$url/api/health" | grep -o '"commit":"[a-f0-9]*"' || true)
            [ -n "$live" ] && echo "$url -> $live"
          done
          echo "expected ${GITHUB_SHA}"
